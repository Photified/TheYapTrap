<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Yap Trap</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f44336">
  <style>
    /* CSS FIX: This ensures padding doesn't push elements outside their containers */
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #222;
      --text-color: #fff;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.2s ease;
      overflow-x: hidden;
    }
    
    /* Banner Styles */
    #bannerImage {
      width: 100%;
      max-width: 800px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    /* Cogwheel Settings Button */
    #settingsBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      color: white;
      width: auto;
      padding: 5px;
      margin: 0;
      z-index: 10;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none; 
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20;
      justify-content: center;
      align-items: center;
    }
    .modal {
      background: #333;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      text-align: left;
      position: relative;
    }
    .modal h2 { margin-top: 0; color: #ffeb3b; }
    .modal p, .modal li { font-size: 1.1rem; line-height: 1.5; }
    .close-btn {
      position: absolute;
      top: 10px; right: 15px;
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      width: auto;
      padding: 0;
      margin: 0;
    }
    #installBtn {
      display: none; 
      background-color: #2196F3;
      margin-top: 20px;
    }

    /* Main UI Styles */
    h1 { font-size: 3rem; margin-bottom: 10px; text-transform: uppercase; }
    p.sub { font-size: 1.2rem; margin-bottom: 30px; }
    
    .controls {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 400px;
    }
    
    select, button.main-btn, input[type="range"] {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    
    button.main-btn {
      background-color: #4CAF50;
      color: white;
      text-transform: uppercase;
    }
    button.main-btn:active { transform: scale(0.98); }
    #recordBtn { background-color: #ff9800; }
    
    #armBtn {
      background-color: #f44336;
      font-size: 1.5rem;
      padding: 20px;
      margin-top: 20px;
    }

    /* --- Visual Volume Meter Styles --- */
    .meter-container {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed rgba(255,255,255,0.3);
    }
    .meter-bar-bg {
      width: 100%;
      height: 25px;
      background: #111;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
      margin: 10px 0;
      border: 2px solid #555;
    }
    .meter-bar-fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.05s linear, background-color 0.1s linear;
    }
    .meter-bar-threshold {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #fff;
      box-shadow: 0 0 5px #000;
      z-index: 2;
    }
    #calibrateBtn {
      background-color: #2196F3;
      padding: 10px;
      font-size: 1rem;
    }

    /* Visual States */
    body.armed { background-color: #ffeb3b; color: #000; }
    body.triggered { background-color: #f44336; color: #fff; }
    body.recording { background-color: #ff9800; color: #fff; }
  </style>
</head>
<body>

  <button id="settingsBtn">⚙️</button>

  <img src="banner.png" alt="Yap Trap Banner" id="bannerImage" onerror="this.style.display='none'">

  <h1 id="statusText">YAP TRAP</h1>
  <p class="sub" id="subText">Disarmed.</p>

  <div class="controls">
    <label for="voiceSelect">Select Weapon:</label>
    <select id="voiceSelect">
      <option value="robot">Siri's Evil Twin (Robot)</option>
      <option value="british">Furious British Man</option>
      <option value="custom">My Custom Voice</option>
    </select>

    <button class="main-btn" id="recordBtn">🎤 Record Custom "Shut Up!"</button>

    <div class="meter-container">
      <label for="threshold">Sensitivity (Volume): <span id="threshVal">50</span></label>
      <input type="range" id="threshold" min="10" max="150" value="50">
      
      <div class="meter-bar-bg">
         <div class="meter-bar-fill" id="volumeMeterFill"></div>
         <div class="meter-bar-threshold" id="volumeMeterThreshold"></div>
      </div>
      
      <button class="main-btn" id="calibrateBtn">🔊 Test Ambient Noise</button>
    </div>
  </div>

  <button class="main-btn" id="armBtn">🚨 ARM THE TRAP 🚨</button>

  <div id="helpModal" class="modal-overlay">
    <div class="modal">
      <button class="close-btn" id="closeModalBtn">✖</button>
      <h2>How to Use</h2>
      <ul>
        <li><b>Select a Voice:</b> Choose a preset or record your own.</li>
        <li><b>Test Ambient Noise:</b> Click the test button and adjust the slider so the red line sits just above the normal background noise.</li>
        <li><b>Arm It:</b> Press the big red button. The screen will turn yellow. Let them talk.</li>
      </ul>
      <button class="main-btn" id="installBtn">📱 Install App to Home Screen</button>
    </div>
  </div>

  <script>
    // --- PWA Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
      });
    }

    // --- PWA Install Prompt Logic ---
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBtn.style.display = 'none';
        deferredPrompt = null;
      }
    });

    // --- Modal Logic ---
    const helpModal = document.getElementById('helpModal');
    document.getElementById('settingsBtn').addEventListener('click', () => helpModal.style.display = 'flex');
    document.getElementById('closeModalBtn').addEventListener('click', () => helpModal.style.display = 'none');
    helpModal.addEventListener('click', (e) => { if (e.target === helpModal) helpModal.style.display = 'none'; });

    // --- Core App Variables ---
    let audioContext;
    let analyser;
    let isArmed = false;
    let isCalibrating = false;
    let isCooldown = false;
    let customAudioUrl = null;
    let customAudioElement = new Audio();

    // --- DOM Elements ---
    const body = document.body;
    const statusText = document.getElementById('statusText');
    const subText = document.getElementById('subText');
    const armBtn = document.getElementById('armBtn');
    const recordBtn = document.getElementById('recordBtn');
    const calibrateBtn = document.getElementById('calibrateBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    const thresholdSlider = document.getElementById('threshold');
    const threshValText = document.getElementById('threshVal');
    
    // Meter Elements
    const volumeMeterFill = document.getElementById('volumeMeterFill');
    const volumeMeterThreshold = document.getElementById('volumeMeterThreshold');

    // Update threshold UI & Line Position
    function updateThresholdUI(val) {
      threshValText.innerText = val;
      const percentage = (val / 150) * 100;
      volumeMeterThreshold.style.left = percentage + '%';
    }
    thresholdSlider.addEventListener('input', (e) => updateThresholdUI(e.target.value));
    updateThresholdUI(50); // Initialize

    // --- Voice Logic (Web Speech API) ---
    function speakPreset(type) {
      const utterance = new SpeechSynthesisUtterance("Shut up!");
      utterance.volume = 1;
      if (type === 'robot') {
        utterance.rate = 0.8; utterance.pitch = 0.1;
      } else if (type === 'british') {
        const ukVoice = speechSynthesis.getVoices().find(v => v.lang === 'en-GB');
        if (ukVoice) utterance.voice = ukVoice;
        utterance.rate = 1.3; utterance.pitch = 0.8;
      }
      speechSynthesis.speak(utterance);
    }

    // --- Custom Recording Logic ---
    recordBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mediaRecorder = new MediaRecorder(stream);
        const audioChunks = [];

        mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
        mediaRecorder.onstop = () => {
          customAudioUrl = URL.createObjectURL(new Blob(audioChunks, { type: 'audio/webm' }));
          customAudioElement.src = customAudioUrl;
          body.className = '';
          statusText.innerText = "SAVED!";
          subText.innerText = "Custom voice ready.";
          voiceSelect.value = "custom";
        };

        body.className = 'recording';
        statusText.innerText = "RECORDING...";
        subText.innerText = "Yell 'Shut Up!' now! (2 seconds)";
        
        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 2000);
      } catch (err) { alert("Need mic permission to record!"); }
    });

    // --- Setup Audio Node ---
    async function initAudio() {
      if (!audioContext) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        const microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
      }
      if (audioContext.state === 'suspended') await audioContext.resume();
    }

    // --- Calibrate Mic ---
    calibrateBtn.addEventListener('click', async () => {
      if (isArmed) return; // Prevent testing while armed
      
      if (isCalibrating) {
        isCalibrating = false;
        calibrateBtn.innerText = "🔊 Test Ambient Noise";
        volumeMeterFill.style.width = '0%';
        return;
      }

      try {
        await initAudio();
        isCalibrating = true;
        calibrateBtn.innerText = "🛑 Stop Testing";
        audioLoop(); // Start visual loop
      } catch (err) { alert("Need mic access to test noise!"); }
    });

    // --- Arming the Trap ---
    armBtn.addEventListener('click', async () => {
      if (isArmed) {
        isArmed = false;
        body.className = '';
        statusText.innerText = "YAP TRAP";
        subText.innerText = "Disarmed.";
        armBtn.innerText = "🚨 ARM THE TRAP 🚨";
        
        // If they were calibrating before, keep the meter running, otherwise stop it
        if (!isCalibrating) volumeMeterFill.style.width = '0%';
        return;
      }

      if (voiceSelect.value === 'custom' && !customAudioUrl) {
        alert("You need to record your custom voice first!");
        return;
      }

      try {
        await initAudio();
        
        // Turn off calibration mode visually if it was running
        if (isCalibrating) {
            isCalibrating = false;
            calibrateBtn.innerText = "🔊 Test Ambient Noise";
        }

        isArmed = true;
        body.className = 'armed';
        statusText.innerText = "ARMED";
        subText.innerText = "Listening for nonsense...";
        armBtn.innerText = "🛑 DISARM 🛑";

        audioLoop();
      } catch (err) { alert("Need mic access to listen for yapping!"); }
    });

    // --- Unified Audio Loop (Meter + Trigger) ---
    function audioLoop() {
      if (!isArmed && !isCalibrating) return; // Stop loop if both are off
      if (isCooldown) {
        requestAnimationFrame(audioLoop);
        return;
      }

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
      let averageVolume = sum / dataArray.length;

      const threshold = parseInt(thresholdSlider.value);

      // 1. Update the visual meter
      const percentage = Math.min((averageVolume / 150) * 100, 100);
      volumeMeterFill.style.width = percentage + '%';
      
      // Turn the bar red if it crosses the threshold line
      volumeMeterFill.style.background = averageVolume > threshold ? '#f44336' : '#4caf50';

      // 2. Trigger the Trap (Only if armed)
      if (isArmed && averageVolume > threshold) {
        fireShutUp();
      }

      requestAnimationFrame(audioLoop);
    }

    // --- The Execution ---
    function fireShutUp() {
      isCooldown = true;
      body.className = 'triggered';
      statusText.innerText = "SHUT UP!";
      subText.innerText = "Threshold exceeded.";

      const selectedVoice = voiceSelect.value;
      if (selectedVoice === 'custom') {
        customAudioElement.currentTime = 0;
        customAudioElement.play();
      } else {
        speakPreset(selectedVoice);
      }

      setTimeout(() => {
        if (isArmed) {
          body.className = 'armed';
          statusText.innerText = "ARMED";
          subText.innerText = "Listening for nonsense...";
        }
        isCooldown = false;
      }, 3000);
    }
  </script>
</body>
</html>
